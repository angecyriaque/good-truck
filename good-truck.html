function newOperateur(){
 if(!guard('operateurs'))return;
 openModal('Nouvel opérateur (Armateur ou Transporteur)',
  fld('Catégorie d’opérateur','type','select',{req:1,full:1,options:[['Armateur','⚓ Armateur (Compagnie maritime)'],['Transporteur','🚚 Transporteur (Transport routier)']],value:opFilter==='Transporteur'?'Transporteur':'Armateur'})+
  fld('Nom / Raison sociale','name','text',{req:1,ph:'Ex. Bolloré, Grimaldi, Ivoire Fret…'})+
  fld('Code (SCAC maritime ou Réf. flotte)','code','text',{req:1,ph:'Ex. MSCU ou TLG-CI'})+
  fld('Interlocuteur principal','contact','text',{req:1,ph:'Nom et prénom du contact'})+
  fld('Téléphone','phone','text',{req:1,ph:'+225 …'})+
  fld('Courriel','email','email',{req:1,ph:'contact@operateur.ci'})+
  fld('Lignes maritimes ou Zone / Flotte routière','zone','text',{req:1,ph:'Ex. Lignes Europe → Abidjan ou Flotte 12 camions Vridi'})+
  `<p class="note">Un <b>Armateur</b> apparaîtra automatiquement dans la liste des armateurs à la création d’un dossier de transit. Un <b>Transporteur</b> apparaîtra dans le suivi séquentiel Transit et la planification Transport.</p>`,
  'Créer l’opérateur',data=>{
   const e=req(data,['type','name','code','contact','phone','email','zone']);
   const nm=data.name?.trim();
   if(nm&&S.operators.some(o=>o.name.toLowerCase()===nm.toLowerCase()))e.name='Cet opérateur existe déjà.';
   if(Object.keys(e).length)return e;
   save(`${data.type} « ${nm} » ajouté au référentiel.`,()=>{
    const isArm=data.type==='Armateur';
    S.seq[isArm?'ARM':'TRS']=(S.seq[isArm?'ARM':'TRS']||5)+1;
    const id=`OP-${isArm?'ARM':'TRS'}-${String(S.seq[isArm?'ARM':'TRS']).padStart(2,'0')}`;
    S.operators.push({id,type:data.type,name:nm,code:data.code.trim().toUpperCase(),contact:data.contact.trim(),phone:data.phone.trim(),email:data.email.trim(),zone:data.zone.trim(),active:true});
    audit('Création opérateur',id,`${data.type} · ${nm}`);
    closeModal();
   },submitBtn());
  });
}
function editOperateur(id){
 if(!guard('operateurs'))return;
 const o=S.operators.find(x=>x.id===id);if(!o)return;
 openModal(`Modifier l’opérateur · ${o.name}`,
  fld('Catégorie d’opérateur','type','select',{req:1,full:1,options:[['Armateur','⚓ Armateur (Compagnie maritime)'],['Transporteur','🚚 Transporteur (Transport routier)']],value:o.type})+
  fld('Nom / Raison sociale','name','text',{req:1,value:o.name})+
  fld('Code (SCAC maritime ou Réf. flotte)','code','text',{req:1,value:o.code})+
  fld('Interlocuteur principal','contact','text',{req:1,value:o.contact})+
  fld('Téléphone','phone','text',{req:1,value:o.phone})+
  fld('Courriel','email','email',{req:1,value:o.email})+
  fld('Lignes maritimes ou Zone / Flotte routière','zone','text',{req:1,value:o.zone}),
  'Enregistrer',data=>{
   const e=req(data,['type','name','code','contact','phone','email','zone']);
   const nm=data.name?.trim();
   if(nm&&nm.toLowerCase()!==o.name.toLowerCase()&&S.operators.some(x=>x.name.toLowerCase()===nm.toLowerCase()))e.name='Ce nom d’opérateur existe déjà.';
   if(Object.keys(e).length)return e;
   save(`Opérateur « ${nm} » mis à jour.`,()=>{
    const oldName=o.name;
    Object.assign(o,{type:data.type,name:nm,code:data.code.trim().toUpperCase(),contact:data.contact.trim(),phone:data.phone.trim(),email:data.email.trim(),zone:data.zone.trim()});
    if(oldName!==nm){
     S.dossiers.forEach(d=>{if(d.lam===oldName)d.lam=nm;if(d.trans===oldName)d.trans=nm});
     S.transports.forEach(t=>{if(t.trans===oldName)t.trans=nm});
    }
    audit('Modification opérateur',o.id,`${o.type} · ${nm}`);
    closeModal();
   },submitBtn());
  });
}
function toggleOperateur(id){
 if(!guard('operateurs'))return;
 const o=S.operators.find(x=>x.id===id);if(!o)return;
 save(o.active?`${o.type} « ${o.name} » désactivé.`:`${o.type} « ${o.name} » réactivé.`,()=>{
  o.active=!o.active;
  audit(o.active?'Opérateur réactivé':'Opérateur désactivé',o.id,`${o.type} · ${o.name}`);
 });
}

/* ===================== Chat ===================== */
const convIcon=c=>c.type==='direct'?`<span class="cav" style="background:${user(c.with).c}">${initials(user(c.with).name)}</span>`:
 c.type==='dossier'?`<span class="cav" style="background:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="7" width="18" height="11" rx="1"/><path d="M8 7v11M13 7v11M3 4h18"/></svg></span>`:
 `<span class="cav" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/></svg></span>`;
function visibleConvs(){return (S.convs||[]).map(c=>({...c,messages:c.messages||[],members:c.members||[]}));}
function vChat(){
 const q=chatQ.toLowerCase();
 const list=visibleConvs().filter(c=>(chatF==='tous'||c.type===chatF)&&(!q||(c.title+' '+c.topic+' '+(c.messages||[]).map(m=>m.text||'').join(' ')).toLowerCase().includes(q)));
 if(!curConv||!visibleConvs().some(c=>c.id===curConv))curConv=list[0]?.id||null;
 const groups=[['canal','Canaux d’équipe'],['dossier','Discussions par dossier'],['direct','Messages directs']];
 const c=(S.convs||[]).find(x=>x.id===curConv);
 return hero('chat','Chat interne','Échanges par sujet : canaux d’équipe, discussions rattachées à un dossier et messages directs.','',true)+
 `<div class="chat${window._reading?' reading':''}" id="chatbox">
  <div class="convs"><div class="top2"><input class="field-inline" id="cq" type="search" placeholder="Rechercher une conversation" value="${esc(chatQ)}" aria-label="Rechercher dans le chat">
   <div class="chips">${[['tous','Tous'],['canal','Équipes'],['dossier','Dossiers'],['direct','Directs']].map(([k,l])=>`<button class="chip" data-cf="${k}" aria-pressed="${chatF===k}">${l}</button>`).join('')}</div>
   <button class="btn small" data-act="newConv">${plus()}Nouvelle discussion</button></div>
   <div class="list">${groups.map(([k,l])=>{const g=list.filter(c=>c.type===k);return g.length?`<div class="group-t">${l}</div>`+g.map(c=>{const last=(c.messages||[])[c.messages.length-1];
    return `<button class="conv${c.id===curConv?' active':''}" data-conv="${c.id}">${convIcon(c)}<span class="txt"><b>${esc(c.title)}</b><small>${last?esc((last.author===S.me?'Vous : ':user(last.author).name.split(' ')[0]+' : ')+last.text):esc(c.topic)}</small></span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</button>`}).join(''):''}).join('')||'<p class="empty">Aucune conversation.</p>'}</div></div>
  <div class="thread">${c?`<header><button class="close back" data-act="chatBack" aria-label="Retour aux conversations">‹</button>${convIcon(c)}<div class="grow"><b>${esc(c.title)}</b><small>${esc(c.topic)} · ${(c.members||[]).length} participants</small></div>
    ${c.dossier?`<button class="btn small" data-dossier="${c.dossier}">Ouvrir la fiche</button>`:''}</header>
   <div class="msgs" id="msgs">${msgsHtml(c)}<div class="typing" id="typing" aria-label="Quelqu’un écrit"><i></i><i></i><i></i></div></div>
   <div class="composer"><select id="refSel" aria-label="Joindre une référence"><option value="">+ Référence</option>${S.dossiers.map(d=>`<option>${d.num}</option>`).join('')}${S.transports.map(t=>`<option>${t.id}</option>`).join('')}${S.deliveries.map(l=>`<option>${l.id}</option>`).join('')}</select>
    <textarea id="msgIn" rows="1" placeholder="Écrire dans ${esc(c.title)}" aria-label="Message"></textarea><button class="btn primary" data-act="send" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12l16-8-6 16-2-7z"/></svg>Envoyer</button></div>
   <div class="disclaim">Un message ne vaut pas validation d’un mouvement de stock ou d’une livraison : confirmez-les dans le module concerné.</div>`:'<p class="empty">Choisissez une conversation.</p>'}</div></div>`;
}
function msgsHtml(c){
 if(!c||!c.messages||!c.messages.length)return '<p class="empty" style="padding:24px">Aucun message dans cette discussion.</p>';
 let last='',h='';(c.messages||[]).forEach(m=>{const d=(m.t||'').slice(0,10);if(d&&d!==last){last=d;const n=days(TODAY_ISO,d);h+=`<div class="daysep">${n===0?'Aujourd’hui':n===1?'Hier':fmt(d)}</div>`}
 const mine=m.author===S.me,u=user(m.author);
 h+=`<div class="msg${mine?' mine':''}"><span class="avatar" style="width:28px;height:28px;font-size:11px;background:${u.c}">${initials(u.name)}</span><div class="bubble"><div class="who">${mine?'Vous':esc(u.name)} · ${hm(m.t||'')}</div>${esc(m.text||'')}${m.ref?`<br><button class="refchip" data-ref="${esc(m.ref)}">${esc(m.ref)}</button>`:''}${mine?`<div class="st">${m.read?'Lu':'Envoyé'}</div>`:''}</div></div>`});return h}
function afterChat(){const c=S.convs.find(x=>x.id===curConv);if(c&&c.unread){c.unread=0;persist();renderTabs()}const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
const REPLIES={canal:['Bien reçu, je m’en occupe.','Merci pour l’info, je mets à jour la fiche.','Je vérifie et je reviens vers vous dans la matinée.'],dossier:['Noté. J’ajoute un commentaire officiel dans la fiche du dossier.','D’accord, je relance le transporteur.','Merci, je documente l’action corrective.'],direct:['Parfait, merci !','Je regarde ça tout de suite.','Ok, on en parle à la réunion.']};
function sendMsg(){
 const c=S.convs.find(x=>x.id===curConv),inp=$('#msgIn');if(!c||!inp.value.trim())return;
 // Offline allowed for local demo and intranet

function editUser(id){
 const admin=true;
 const u=S.users.find(x=>x.id===id);if(!u)return;
 openModal(`Modifier le compte utilisateur · ${u.name}`,
  fld('Nom','nom','text',{req:1,value:u.nom||u.name})+
  fld('Prénoms','prenom','text',{req:1,value:u.prenom||''})+
  fld('Adresse mail','email','email',{req:1,value:u.email})+
  fld('Fonction','fonction','text',{req:1,value:u.fonction||''})+
  fld('Départements','dept','select',{req:1,options:DEPARTEMENTS,value:u.dept||DEPARTEMENTS[0][0]})+
  (admin?fld('Niveau d’accès','role','select',{req:1,options:ROLES,value:u.role}):'')+
  fld('Mot de Passe','password','password',{ph:'Laisser vide pour conserver le mot de passe actuel'}),
  'Enregistrer les modifications',data=>{
   const fields=['nom','prenom','email','fonction','dept'];
   if(admin)fields.push('role');
   const e=req(data,fields);
   const email=data.email?.trim().toLowerCase();
   if(email&&!/^\S+@\S+\.\S+$/.test(email))e.email='Adresse mail invalide.';
   if(S.users.some(x=>x.id!==u.id&&x.email.toLowerCase()===email))e.email='Cette adresse mail est déjà utilisée.';
   if(data.password&&data.password.length<4)e.password='Le mot de passe doit comporter au moins 4 caractères.';
   if(Object.keys(e).length)return e;
   const nom=data.nom.trim().toUpperCase();
   const prenom=data.prenom.trim();
   const name=`${prenom} ${nom}`.trim();
   save(`Compte de ${name} mis à jour.`,()=>{
    u.nom=nom;
    u.prenom=prenom;
    u.name=name;
    u.email=email;
    u.fonction=data.fonction.trim();
    u.dept=data.dept;
    if(admin&&data.role)u.role=data.role;
    if(data.password?.trim())u.password=data.password.trim();
    audit('Modification compte utilisateur',u.name,`${u.fonction} (${u.dept}) · Niveau d’accès: ${u.role}`);
    closeModal();
   },submitBtn());
  }
 );
}

  ...S.transports.filter(t=>[t.id,t.veh,t.trans,t.to].join(' ').toLowerCase().includes(q)).map(t=>({k:'Suivi Transport',t:t.id,s:`${t.trans} · ${t.to} (${t.status})`,go:()=>{lvSub='suivi';trFilter='Tous';goTab('livraisons')}})),
  ...(S.planifications||[]).filter(p=>[p.id,p.to,p.trans,p.veh,p.driver].join(' ').toLowerCase().includes(q)).map(p=>({k:'Planification',t:p.id,s:`${p.to} · ${p.qty} palettes (${p.status})`,go:()=>{lvSub='planification';plnFilter='Tous';goTab('livraisons')}})),

  ...(S.operators||[]).filter(o=>[o.id,o.name,o.code,o.type].join(' ').toLowerCase().includes(q)).map(o=>({k:o.type,t:o.name,s:`${o.id} · ${o.code}`,go:()=>{opFilter=o.type;goTab('operateurs')}}))].slice(0,10);
 window._sr=items;r.innerHTML=items.length?items.map((x,i)=>`<button data-sr="${i}"><span class="k">${x.k}</span><span><b>${esc(x.t)}</b><br><small class="muted">${esc(x.s)}</small></span></button>`).join(''):'<p class="empty" style="padding:14px">Aucun résultat pour cette recherche.</p>';r.classList.add('open')}

  tPlan:()=>tPlan(id),tStartLoad:()=>tStartLoad(id),tStart:()=>tStart(id),tDeliver:()=>tDeliver(id),tClose:()=>tClose(id),tIncident:()=>tIncident(id),
  lReserve:()=>lReserve(id),lShip:()=>lShip(id),lReceive:()=>lReceive(id),lClose:()=>lClose(id),lCancel:()=>lCancel(id),
  editInit:()=>editInit(id),confirmArrival:()=>confirmArrival(id),validerDepotage:()=>validerDepotage(id),cancelEditDates:()=>openDossier(id,false),
  validerStepJour:()=>{if(!guard('transit'))return;const d=S.dossiers.find(x=>x.id===id);if(!d||!d.D3)return;
   const sk=a.dataset.step,st=SEQ_STEPS.find(x=>x.k===sk);if(!st||d[sk])return;
   if(!d[st.prev]){toast(`Validez d’abord « ${st.prevLabel} ».`,'bad');return}
   save(`« ${st.label} » validée à la date du jour (${fmt(TODAY_ISO)}).`,()=>{
    d[sk]=TODAY_ISO;d.updatedAt=nowISO();d.updatedBy=S.me;
    audit('Validation étape Transit (date du jour)',d.num,`${st.label} → ${fmt(TODAY_ISO)}`);
    setTimeout(()=>openDossier(id,false),30);
   },a)},
  editDates:()=>{if(!guard('transit'))return;const d=S.dossiers.find(x=>x.id===id);if(!d.D3){toast('Confirmez d’abord l’arrivée du navire avant de renseigner le suivi.','bad');return}openDossier(id,true)},
  saveDates:()=>{if(!guard('transit'))return;const d=S.dossiers.find(x=>x.id===id);if(!d.D3){toast('Arrivée du navire non confirmée.','bad');return}
   const f=$('#datesForm'),vals=Object.fromEntries(new FormData(f));
   const next={};
   for(const s of SEQ_STEPS){
    const prevOk=s.prev==='D3'?!!d.D3:!!next[s.prev];
    if(d[s.k]){next[s.k]=d[s.k];continue}
    const chk=f.querySelector(`[data-chk="${s.k}"]`);
    const raw=s.type==='date'?(chk?.checked?TODAY_ISO:(vals[s.k]||'')):(vals[s.k]||'');
    if(!prevOk&&raw){toast(`Ordre séquentiel non respecté : validez d’abord « ${s.prevLabel} » avant « ${s.label} ».`,'bad');return}
    if(s.type==='date'&&raw&&raw<TODAY_ISO){toast(`Aucune date antérieure ne peut être saisie pour « ${s.label} ». C’est la date du jour (${fmt(TODAY_ISO)}) qui est prise en compte.`,'bad');return}
    next[s.k]=prevOk?(s.type==='date'&&raw?TODAY_ISO:raw):'';
   }
   let depTotal=0,depModel='MB5',hasDep=false;
   if(next.D6&&!d.depotage){
    depTotal=+(vals.dep_total??0);
    depModel=vals.dep_model||'MB5';
    if(!Number.isInteger(depTotal)||depTotal<=0){toast('Pour confirmer le dépotage, renseignez une quantité totale supérieure à 0.','bad');return}
    hasDep=true;
   }
   const ch=SEQ_STEPS.filter(s=>(next[s.k]||'')!==(d[s.k]||''));
   if(!ch.length&&!hasDep){openDossier(id,false);return}
   save(hasDep?`Suivi validé au ${fmt(TODAY_ISO)} & dépotage (${n0(depTotal)} palettes) transmis à l’Entrepôt.`:`Suivi validé au ${fmt(TODAY_ISO)} (${ch.map(s=>s.label).join(', ')}).`,()=>{
    ch.forEach(s=>d[s.k]=next[s.k]||'');
    if(hasDep)applyDepotage(d,TODAY_ISO,depTotal,depModel);
    d.updatedAt=nowISO();d.updatedBy=S.me;
    audit('Validation suivi séquentiel (au jour le jour)',d.num,ch.map(s=>`${s.label} → ${s.type==='select'?(d[s.k]||'vide'):(fmt(d[s.k])||'vide')}`).join(', '));
    setTimeout(()=>openDossier(id,false),30);
   },a)},
  addComment:()=>{if(!guard('transit'))return;const v=$('#newc').value.trim();if(!v){toast('Écrivez un commentaire avant de publier.','bad');return}const d=S.dossiers.find(x=>x.id===id);
   save('Commentaire publié.',()=>{d.comments.push({id:'c'+Date.now(),author:S.me,t:nowISO(),text:v,history:[]});d.updatedAt=nowISO();d.updatedBy=S.me;audit('Commentaire',d.num,v.slice(0,60));setTimeout(()=>openDossier(id),30)},a)},
  closeDossier:()=>{if(!guard('transit'))return;const d=S.dossiers.find(x=>x.id===id);if(!d.D1||!d.D8){toast('Clôture impossible : Fin de franchise et Date de récupération doivent être renseignées.','bad');return}
   const x=delay(d);if(x.k==='anom'){toast('Clôture impossible : corrigez d’abord l’incohérence de dates.','bad');return}
   if(x.k==='bad'&&!d.comments.length){toast('Dossier Off Time : documentez le motif en commentaire avant de clôturer.','bad');return}
   openModal(`Clôturer ${d.num} ?`,`<p class="full" style="margin:0">Les modifications ordinaires seront bloquées. L’historique reste consultable et le dossier peut être rouvert par un utilisateur autorisé.</p>`,'Clôturer le dossier',()=>{save(`${d.num} clôturé.`,()=>{d.status='Clôturé';d.updatedAt=nowISO();d.updatedBy=S.me;audit('Clôture de dossier',d.num,`Délai ${x.n} j (${x.app})`);closeModal();setTimeout(()=>openDossier(id),30)},submitBtn())})},
  reopen:()=>{if(!guard('transit'))return;const d=S.dossiers.find(x=>x.id===id);save(`${d.num} rouvert.`,()=>{d.status='Ouvert';d.updatedAt=nowISO();d.updatedBy=S.me;audit('Réouverture',d.num,'');setTimeout(()=>openDossier(id),30)},a)},
  openConv:()=>{closeDrawer();openConvFor(a.dataset.dossier)},
  copyFiche:()=>{const d=S.dossiers.find(x=>x.id===id),x=delay(d);const t=`Dossier : ${d.num}\nN° Conteneur (TC) : ${d.cont}\nN° Bon de Livraison : ${d.bl}\nArmateur : ${d.lam}\nFin de franchise : ${fmt(d.D1)||'non renseignée'}\nETA Navire : ${fmt(d.D2)||'non renseignée'}\nArrivée navire : ${fmt(d.D3)||'En attente'}\nMise en livraison : ${fmt(d.D4)||'non renseignée'}\nTransporteur : ${d.trans||'non renseigné'}\nDate de réception : ${fmt(d.D5)||'non renseignée'}\nDate de dépotage : ${fmt(d.D6)||'non renseignée'}\nMail de récupération : ${fmt(d.D7)||'non renseignée'}\nDate de récupération : ${fmt(d.D8)||'non renseignée'}\nStatut : ${x.label}\nAppréciation : ${x.app||'En attente'}${x.n!=null?' ('+x.n+' j)':''}\nGénéré le ${fmt(TODAY_ISO)}`;
   (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Fiche copiée dans le presse-papiers.','ok')).catch(()=>toast('Copie impossible dans ce navigateur.','bad'))},
  exportJSON:()=>{
   try {
    const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));
    const dl=document.createElement('a');
    dl.setAttribute("href",dataStr);
    dl.setAttribute("download",`goodtruck-backup-${curSite()}-${nowISO().slice(0,10)}.json`);
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
    toast('Sauvegarde JSON exportée avec succès !','ok');
   }catch(e){toast('Erreur export JSON: '+e.message,'bad')}
  },
  send:sendMsg,chatBack:()=>{window._reading=false;$('#chatbox').classList.remove('reading')},
  viewUser:()=>viewUser(id),
  editUser:()=>editUser(id),
  toggleUser:()=>{const u=S.users.find(x=>x.id===id);save(u.active?`Compte de ${u.name} désactivé.`:`Compte de ${u.name} réactivé.`,()=>{u.active=!u.active;audit(u.active?'Compte réactivé':'Compte désactivé',u.name,'')})},
  reset:()=>openModal('Réinitialiser la démonstration ?','<p class="full" style="margin:0">Toutes les saisies faites dans ce navigateur seront remplacées par les données d’exemple.</p>','Réinitialiser',()=>{S=seed();persist();closeModal();toast('Données de démonstration restaurées.','ok');goTab('dashboard')})
 };
 A[a.dataset.act]?.();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();closeDrawer();$('#notif').classList.remove('open');$('#results').classList.remove('open')}
 if(e.key==='Enter'&&e.target.matches('tr[data-dossier]'))openDossier(e.target.dataset.dossier);
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msgIn'){e.preventDefault();sendMsg()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q')search(e.target.value);
 if(e.target.id==='fq'){fQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}
 if(e.target.id==='opq'){opQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#opq');n.focus();n.setSelectionRange(p,p)}
 if(e.target.id==='cq'){chatQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='ftr'){fTrans=e.target.value;render()}
 if(e.target.id==='prodDateIn'){prodDate=e.target.value||TODAY_ISO;render()}
 if(e.target.id==='meSel'){
  if(e.target.value==='guest'){
    S.me='guest';
    persist();
    toast('Mode Consultation libre actif. Vous pouvez consulter toutes les informations sans modification.','info');
    render();
  } else {
    S.me=e.target.value;
    persist();
    toast(`Connecté au compte de ${me().name} (${me().role}). Modifications autorisées.`,'ok');
    render();
  }
}
 if(e.target.dataset.role){const u=S.users.find(x=>x.id===e.target.dataset.role);save(`Rôle de ${u.name} : ${e.target.value}.`,()=>{audit('Changement de rôle',u.name,`${u.role} → ${e.target.value}`);u.role=e.target.value})}
});
$('#bell').addEventListener('click',()=>{const n=$('#notif');n.classList.toggle('open');$('#bell').setAttribute('aria-expanded',n.classList.contains('open'))});
$('#scrim').addEventListener('click',closeDrawer);
$('#theme').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('goodtruck-theme',r.dataset.theme)}catch(e){}render()});
try{const th=localStorage.getItem('goodtruck-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const net=()=>$('#net').classList.toggle('show',!navigator.onLine);addEventListener('online',()=>{net();toast('Connexion rétablie.','ok')});addEventListener('offline',()=>{net();toast('Connexion perdue : les saisies ne seront pas enregistrées.','bad')});net();
const setHH=()=>document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px');addEventListener('resize',setHH);setHH();
const h=location.hash.slice(1);if(TABS.some(t=>t.k===h))tab=h;
window.addEventListener('hashchange',()=>{
 const nh=location.hash.slice(1);
 if(TABS.some(t=>t.k===nh)&&tab!==nh)goTab(nh);
});
render();
